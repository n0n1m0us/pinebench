<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <title>Pinebench</title>
  <style>
    .tile { fill: #1d1c18; }
    .wick { stroke: #fffdf0; }
    .up   { fill: #1d1c18; stroke: #fffdf0; }
    .down { fill: #8b7d45; }
    .top  { fill: #e2bd55; }
    .bench { stroke: #fffdf0; }
    .word { font: 700 52px -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; }
    .pine { fill: #1d1c18; }
    .rest { fill: #8b7d45; }
    @media (prefers-color-scheme: dark) {
      .pine { fill: #e6e2d3; }
      .rest { fill: #b3a465; }
    }
  </style>
  <rect class="tile" width="96" height="96" rx="22"/>
  <line class="wick" x1="48" y1="12" x2="48" y2="80" stroke-width="3" stroke-linecap="round"/>
  <rect class="top"  x="39" y="17" width="18" height="9" rx="2"/>
  <rect class="up"   x="30.5" y="31.5" width="35" height="8" rx="2" stroke-width="3"/>
  <rect class="down" x="21" y="45" width="54" height="9" rx="2"/>
  <rect class="up"   x="13.5" y="59.5" width="69" height="8" rx="2" stroke-width="3"/>
  <line class="bench" x1="22" y1="80" x2="74" y2="80" stroke-width="3" stroke-linecap="round"/>
  <text class="word" x="118" y="66"><tspan class="pine">pine</tspan><tspan class="rest">bench</tspan></text>
</svg>
