<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinebench · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #fffdf0;
      --color-ink:    #1d1c18;
      --color-muted:  #6e6a5e;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { background: var(--color-paper); color: var(--color-ink); padding: 40px 48px 32px; width: 1096px; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; letter-spacing: -0.02em;
         line-height: 1.15; margin-bottom: 1rem; }
    .wrap { overflow-x: auto; }
    svg { width: 1000px; min-width: 1000px; height: 464px; display: block; }
  </style>
</head>
<body>
  <p class="eyebrow">Architecture · Pinebench</p>
  <h1>Your strategy, your data, your machine</h1>
  <div class="wrap">
  <svg viewBox="0 64 1000 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
    <title id="architecture-title">Pinebench architecture</title>
    <desc id="architecture-desc">Local CSV bars and a Pine strategy feed the PineTS backtest engine, whose results a local server sends to the browser UI, with worker pools for optimization and replay overlays.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e6a5e"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b7d45"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f6f95"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#fffdf0"/>

    <!-- Zone: everything runs locally -->
    <rect x="40" y="80" width="920" height="376" rx="8" fill="rgba(29,28,24,0.02)" stroke="rgba(29,28,24,0.14)" stroke-width="0.8" stroke-dasharray="4,4"/>
    <rect x="380" y="84" width="240" height="12" rx="2" fill="#fffdf0"/>
    <text x="500" y="93" fill="rgba(29,28,24,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MACHINE · 127.0.0.1 · NOTHING UPLOADED</text>

    <!-- Arrows (behind nodes) -->
    <path d="M 200,208 H 240 Q 248,208 248,216 V 252 Q 248,260 256,260 H 296" fill="none" stroke="#6e6a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 200,336 H 240 Q 248,336 248,328 V 292 Q 248,284 256,284 H 296" fill="none" stroke="#6e6a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="472" y1="272" x2="552" y2="272" stroke="#8b7d45" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="632" y1="240" x2="632" y2="176" stroke="#6e6a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="632" y1="304" x2="632" y2="368" stroke="#6e6a5e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="792" y1="260" x2="712" y2="260" stroke="#4f6f95" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <line x1="712" y1="284" x2="792" y2="284" stroke="#6e6a5e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="208" y="226" width="32" height="12" rx="2" fill="#fffdf0"/>
    <text x="224" y="235" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BARS</text>
    <rect x="200" y="300" width="40" height="12" rx="2" fill="#fffdf0"/>
    <text x="220" y="309" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
    <rect x="484" y="250" width="56" height="12" rx="2" fill="#fffdf0"/>
    <text x="512" y="259" fill="#8b7d45" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRADES</text>
    <rect x="640" y="202" width="64" height="12" rx="2" fill="#fffdf0"/>
    <text x="672" y="211" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRID SEARCH</text>
    <rect x="640" y="330" width="48" height="12" rx="2" fill="#fffdf0"/>
    <text x="664" y="339" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OVERLAY</text>
    <rect x="720" y="238" width="64" height="12" rx="2" fill="#fffdf0"/>
    <text x="752" y="247" fill="#4f6f95" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">/API/RUN</text>
    <rect x="732" y="292" width="40" height="12" rx="2" fill="#fffdf0"/>
    <text x="752" y="301" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>

    <!-- Node: OHLCV data (store) -->
    <rect x="72" y="176" width="128" height="64" rx="6" fill="#fffdf0"/>
    <rect x="72" y="176" width="128" height="64" rx="6" fill="rgba(29,28,24,0.05)" stroke="#6e6a5e" stroke-width="1"/>
    <rect x="80" y="184" width="32" height="12" rx="2" fill="transparent" stroke="rgba(110,106,94,0.50)" stroke-width="0.8"/>
    <text x="96" y="193" fill="#6e6a5e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
    <text x="136" y="212" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">OHLCV data</text>
    <text x="136" y="228" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/*.csv · rolled</text>

    <!-- Node: Pine strategy (input) -->
    <rect x="72" y="304" width="128" height="64" rx="6" fill="#fffdf0"/>
    <rect x="72" y="304" width="128" height="64" rx="6" fill="rgba(110,106,94,0.10)" stroke="#8f8a7c" stroke-width="1"/>
    <rect x="80" y="312" width="32" height="12" rx="2" fill="transparent" stroke="rgba(143,138,124,0.45)" stroke-width="0.8"/>
    <text x="96" y="321" fill="#8f8a7c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PINE</text>
    <text x="136" y="340" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Pine strategy</text>
    <text x="136" y="356" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strategies/*.pine</text>

    <!-- Node: Backtest engine (focal) -->
    <rect x="296" y="240" width="176" height="64" rx="6" fill="#fffdf0"/>
    <rect x="296" y="240" width="176" height="64" rx="6" fill="rgba(139,125,69,0.10)" stroke="#8b7d45" stroke-width="1"/>
    <rect x="304" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(139,125,69,0.55)" stroke-width="0.8"/>
    <text x="320" y="257" fill="#8b7d45" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
    <text x="384" y="276" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Backtest engine</text>
    <text x="384" y="292" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backtest.mjs + PineTS</text>

    <!-- Node: Local server -->
    <rect x="552" y="240" width="160" height="64" rx="6" fill="#fffdf0"/>
    <rect x="552" y="240" width="160" height="64" rx="6" fill="#ffffff" stroke="#1d1c18" stroke-width="1"/>
    <rect x="560" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(29,28,24,0.40)" stroke-width="0.8"/>
    <text x="576" y="257" fill="#1d1c18" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
    <text x="632" y="276" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Local server</text>
    <text x="632" y="292" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">server.mjs · :8787</text>

    <!-- Node: Optimizer pool -->
    <rect x="552" y="112" width="160" height="64" rx="6" fill="#fffdf0"/>
    <rect x="552" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#1d1c18" stroke-width="1"/>
    <rect x="560" y="120" width="32" height="12" rx="2" fill="transparent" stroke="rgba(29,28,24,0.40)" stroke-width="0.8"/>
    <text x="576" y="129" fill="#1d1c18" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
    <text x="632" y="148" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Optimizer</text>
    <text x="632" y="164" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 worker per CPU core</text>

    <!-- Node: Replay overlays -->
    <rect x="552" y="368" width="160" height="64" rx="6" fill="#fffdf0"/>
    <rect x="552" y="368" width="160" height="64" rx="6" fill="#ffffff" stroke="#1d1c18" stroke-width="1"/>
    <rect x="560" y="376" width="32" height="12" rx="2" fill="transparent" stroke="rgba(29,28,24,0.40)" stroke-width="0.8"/>
    <text x="576" y="385" fill="#1d1c18" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
    <text x="632" y="404" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Replay overlays</text>
    <text x="632" y="420" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pine indicators per bar</text>

    <!-- Node: Browser UI (you) -->
    <rect x="792" y="240" width="144" height="64" rx="6" fill="#fffdf0"/>
    <rect x="792" y="240" width="144" height="64" rx="6" fill="rgba(110,106,94,0.10)" stroke="#8f8a7c" stroke-width="1"/>
    <rect x="800" y="248" width="20" height="12" rx="2" fill="transparent" stroke="rgba(143,138,124,0.45)" stroke-width="0.8"/>
    <text x="810" y="257" fill="#8f8a7c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="864" y="276" fill="#1d1c18" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', sans-serif" text-anchor="middle">Browser</text>
    <text x="864" y="292" fill="#6e6a5e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chart · replay · report</text>

    <!-- Legend strip -->
    <line x1="40" y1="476" x2="960" y2="476" stroke="rgba(29,28,24,0.10)" stroke-width="0.8"/>
    <text x="40" y="492" fill="#6e6a5e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="504" width="14" height="10" rx="2" fill="rgba(139,125,69,0.10)" stroke="#8b7d45" stroke-width="1"/>
    <text x="60" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">Core engine</text>
    <rect x="156" y="504" width="14" height="10" rx="2" fill="#ffffff" stroke="#1d1c18" stroke-width="1"/>
    <text x="176" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">Process</text>
    <rect x="248" y="504" width="14" height="10" rx="2" fill="rgba(29,28,24,0.05)" stroke="#6e6a5e" stroke-width="1"/>
    <text x="268" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">Files on disk</text>
    <rect x="364" y="504" width="14" height="10" rx="2" fill="rgba(110,106,94,0.10)" stroke="#8f8a7c" stroke-width="1"/>
    <text x="384" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">You</text>
    <line x1="448" y1="510" x2="476" y2="510" stroke="#8b7d45" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="484" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">Primary flow</text>
    <line x1="584" y1="510" x2="612" y2="510" stroke="#4f6f95" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <text x="620" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">HTTP request</text>
    <line x1="720" y1="510" x2="748" y2="510" stroke="#6e6a5e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="756" y="512" fill="#6e6a5e" font-size="8.5" font-family="'Schibsted Grotesk', sans-serif">Response</text>
  </svg>
  </div>
</body>
</html>
